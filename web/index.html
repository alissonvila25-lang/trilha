<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trilha de Reforçadores</title>
<meta name="theme-color" content="#8F6650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trilha">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="app">
  <header style="display:flex;flex-direction:column;gap:4px">
    <span class="eyebrow" id="hello">Programa de reforço</span>
    <h1 style="font-size:28px">Trilha de Reforçadores</h1>
  </header>

  <!-- Entrada do código (quando o app abre sem o link) -->
  <section class="panel" id="code-screen" hidden>
    <h3>Digite seu código de acesso</h3>
    <p class="hint">Ele está no link que sua psicóloga enviou (as letras depois de <b>?p=</b>).</p>
    <form id="code-form" class="btns">
      <input type="text" id="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ex.: K7M4QX9P2B3H" style="flex:1;letter-spacing:.08em;text-transform:uppercase">
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="hint" id="code-error" hidden></p>
  </section>

  <div id="main" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div id="install"></div>
      <section class="score" id="score"></section>
      <div id="nudge"></div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="hoje" aria-selected="true">Atividades</button>
        <button class="tab" role="tab" data-tab="premios" aria-selected="false">Reforçadores</button>
      </div>
      <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
      <div id="sync" class="hint" style="text-align:center"></div>
    </div>
  </div>
</div>
<div id="modal"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="patient.js"></script>
</body>
</html>
